name: Build SuperHentaiBlog

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/pt/superhentaiblog/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Format Code
        run: ./gradlew :src:pt:superhentaiblog:spotlessApply

      - name: Build Extension
        run: ./gradlew :src:pt:superhentaiblog:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: superhentaiblog-apk
          path: src/pt/superhentaiblog/build/outputs/apk/release/*.apk
