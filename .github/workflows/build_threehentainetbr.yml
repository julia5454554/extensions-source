name: Build 3HentaiNetBr Extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build only the 3HentaiNetBr extension
        run: ./gradlew :src:eu:kanade:tachiyomi:extension:pt:threehentainetbr:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: threehentainetbr-extension-apk
          path: src/eu/kanade/tachiyomi/extension/pt/threehentainetbr/build/outputs/apk/release/*.apk
