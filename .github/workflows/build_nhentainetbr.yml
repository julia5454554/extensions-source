name: Build NHentaiNetBr

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/pt/nhentainetbr/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew :src:pt:nhentainetbr:spotlessApply
      - run: ./gradlew :src:pt:nhentainetbr:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nhentainetbr-apk
          path: src/pt/nhentainetbr/build/outputs/apk/release/*.apk
