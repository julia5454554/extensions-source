name: Build MeuHentai

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/pt/meuhentai/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Format Code (Spotless)
        run: ./gradlew :src:pt:meuhentai:spotlessApply

      - name: Build Extension
        run: ./gradlew :src:pt:meuhentai:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meuhentai-apk
          path: src/pt/meuhentai/build/outputs/apk/release/*.apk
