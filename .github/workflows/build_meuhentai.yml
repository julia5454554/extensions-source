name: Build MeuHentai Extension

on:
  push:
    branches: [ main ]
    paths:
      - 'src/pt/meuhentai/**'
      - 'build-logic/**'
      - 'core/**'
      - 'compiler/**'
      - '.github/workflows/meuhentai.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/pt/meuhentai/**'
      - 'build-logic/**'
      - 'core/**'
      - 'compiler/**'
      - '.github/workflows/meuhentai.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Spotless Apply (auto-format)
        run: ./gradlew spotlessApply

      - name: Build only MeuHentai extension
        run: ./gradlew :src:pt:meuhentai:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meuhentai-extension-apk
          path: src/pt/meuhentai/build/outputs/apk/release/*.apk
