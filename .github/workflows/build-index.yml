name: Build and Publish Index

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Permite rodar manualmente pelo botão

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate index files
        run: ./gradlew makeIndex --no-daemon

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.pb index.min.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update index files"
          git push origin main
