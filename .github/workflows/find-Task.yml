name: Find Gradle Task

on:
  workflow_dispatch:

jobs:
  find-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: List relevant tasks
        run: ./gradlew tasks --all | grep -iE 'index|repo|pb|json' || echo "Nenhuma tarefa encontrada com esses nomes."
