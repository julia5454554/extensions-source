name: Build InstaHentai

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: ./gradlew :src:pt:instahentai:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaHentai-APK
          path: src/pt/instahentai/build/outputs/apk/debug/*.apk
